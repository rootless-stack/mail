name: images

on:
  push:
    branches: [main]
    paths: [dockerfiles/**, .github/workflows/images.yml]
  pull_request:
    paths: [dockerfiles/**, .github/workflows/images.yml]
  # Nightly cold rebuild: picks up Alpine package security fixes.  Promote
  # publishes only images whose content changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      no-cache:
        description: Rebuild cold, like the nightly run (an urgent package fix)
        type: boolean
        default: false
      resign:
        description: Promote and sign every image even if unchanged (key rotation)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix: &images
        include:
          - {image: postfix, context: dockerfiles, file: dockerfiles/postfix/Dockerfile}
          - {image: dovecot, context: dockerfiles, file: dockerfiles/dovecot/Dockerfile}
          - {image: rspamd, context: dockerfiles/rspamd}
          - {image: postfwd, context: dockerfiles/postfwd}
          - {image: clamd, context: dockerfiles/clamd}
    uses: rootless-stack/.github/.github/workflows/build-image.yml@main
    with:
      image: ${{ matrix.image }}
      context: ${{ matrix.context }}
      file: ${{ matrix.file || '' }}
      no-cache: ${{ github.event_name == 'schedule' || inputs.no-cache == true }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read
      packages: write

  # The stack's validators of the candidates belong between build and
  # promote: promote publishes only what passed them.
  promote:
    needs: build
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix: *images
    uses: rootless-stack/.github/.github/workflows/promote-image.yml@main
    with:
      image: ${{ matrix.image }}
      tag: alpine3.24
      resign: ${{ inputs.resign || false }}
    secrets:
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
    permissions:
      contents: read
      packages: write
      id-token: write
