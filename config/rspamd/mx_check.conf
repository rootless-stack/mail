# mx_check probes TCP 25 of the *sender domain's* MX — the only rspamd rule
# where an untrusted party (whoever sets the From domain) picks who our
# server connects to.  Greylisting is already score-driven (metrics.conf),
# so the forced `greylist_invalid` path added ~nothing.  Disabled 2026-09-22.
enabled = false;
