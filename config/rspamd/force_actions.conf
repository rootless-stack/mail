rules {

  EICAR_SIGNATURE {
    action = "rewrite subject";
    expression = "JUST_EICAR";
    subject = "[EICAR] %s";
    # Do not override these actions even if our rule matches
    honor_action = ["reject", "soft reject"];
  }

  # rspamd's dmarc module only scores a policy failure.  Mail claiming one
  # of OUR domains that fails DMARC is a spoof (all our mail is signed,
  # bounces included) and must not reach a mailbox: a Sieve redirect would
  # forward it with our DKIM signature (postfix master.cf sieve-submit).
  # Authenticated and local mail is never DMARC-checked, so own mail passes.
  OWN_DOMAIN_DMARC_REJECT {
    action = "reject";
    expression = "DMARC_POLICY_REJECT & FROM_OWN_DOMAIN";
    message = "Rejected: forged sender of our domain (DMARC)";
    honor_action = ["reject"];
  }
  VIRUS_DETECTED {
    action = "reject";
    expression = "CLAM_VIRUS";
    message = "Rejected due to suspicion of virus";
    honor_action = ["reject"];
  }
}
