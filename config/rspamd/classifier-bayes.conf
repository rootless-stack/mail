# rspamd local.d/classifier-bayes.conf
autolearn = true;
classifier "bayes" {
  tokenizer { name = "osb"; }
  min_learns = 200;
  min_token_hits = 0;
  max_tokens = 1000;
  backend = "redis";
  min_bayes_score = 0.05;
  min_bayes_tokens = 11;
  # new_schema controls the Redis key layout for the bayes corpus:
  #   true  → one hash per language, token-count fields, separate :learns counter.
  #   false → one key per token, legacy layout (rspamd ≤ 3.7 default).
  # The old server (rspamd 3.7.1) was on the legacy layout, and the entire
  # corpus has been replicated bit-for-bit via REPLICAOF.  Setting `false`
  # here lets the new rspamd read those existing keys correctly — flipping
  # to `true` would have rspamd ignore the inherited training and start
  # from zero.  Once we'd want to retire the old schema we can run
  # `rspamadm statconvert` to upgrade in place, but for the migration
  # window we want maximum continuity.
  new_schema = false;
  per_user = false;
  cache {
    type = "redis";
  }
}
