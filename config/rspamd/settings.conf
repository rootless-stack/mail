# Per-user and per-role rspamd policy settings

# Postmaster/webmaster/hostmaster: higher rate limits, no spam actions
postmaster {
    rcpt = "postmaster";
    rcpt = "webmaster";
    rcpt = "hostmaster";

    apply {
        rates {
            to = {
                bucket = {
                    burst = 10;
                    rate = "10 / 1min";
                }
            }
        }
    }
}

# Authenticated users: strict Bayes threshold so spam from our own users is
# rejected early, but greylist kicks in at a lower score to catch borderline mail.
authenticated {
    id = "authenticated_users";
    priority = "high";
    authenticated = yes;

    apply {
        BAYES_SPAM = 10.0;

        actions {
            reject    = 10.0;
            add_header = 7.5;
            greylist  = 5.0;
        }
    }
}
