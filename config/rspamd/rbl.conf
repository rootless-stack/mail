rbls {
    ###########################################################################
    # Survey of what exists, per list, with type and IPv6 support:            #
    #   https://multirbl.valli.org/list/                                      #
    # Check any candidate there first - it tracks which lists are dead.       #
    #                                                                         #
    # Only the lists rspamd does NOT already query itself.                    #
    #                                                                         #
    # rspamd's stock modules.d/rbl.conf already ships (and scores)            #
    # zen.spamhaus.org, dbl.spamhaus.org, bl.blocklist.de (RBL_BLOCKLISTDE /  #
    # RECEIVED_BLOCKLISTDE) and rep.mailspike.net (RBL_MAILSPIKE_* plus       #
    # negative-weight RWL_MAILSPIKE_* for senders with a good reputation).    #
    # Re-declaring one of those here adds no coverage: it queries the same    #
    # zone a second time and scores the same listing under two symbols.  To   #
    # retune them, set the weight in metrics.conf - never redefine the rbl.   #
    #                                                                         #
    # Both lists below answer only 127.0.0.2, but no `returncodes` map is     #
    # declared on purpose.  A map that stops matching - a provider re-coding  #
    # its answers - fails silently: the symbol just never fires again.  That  #
    # is exactly what had disabled BlockList.de and DroneBL here.  Any        #
    # listing scores.                                                         #
    #                                                                         #
    # Weights live in metrics.conf and are deliberately small: no single      #
    # list may reach the reject threshold on its own.                         #
    #                                                                         #
    # Removed 2026-09-22, dead:                                               #
    #   db.wpbl.info         WPBL, gone                                       #
    #   dnsbl.sorbs.net      SORBS, shut down by Proofpoint 2024-06-05        #
    #   ix.dnsbl.manitu.net  NiX Spam, shut down 2025-01-16 (heise withdrew   #
    #                        as operator, manitu found the GDPR/NIS2 risk     #
    #                        uneconomical)                                    #
    #   dnsbl.cobion.com     IBM/Cobion, long defunct                         #
    #   swl.spamhaus.org     Spamhaus IP whitelist, retired under RFC 6471    #
    # A dead zone is not free: it costs a DNS round trip per message and its  #
    # weight silently stops contributing (NiX Spam was our heaviest, at 4.0). #
    # Check A *and* TXT before trusting a zone: the first four answer nothing #
    # at all for their own 2.0.0.127 test entry, but swl.spamhaus.org still   #
    # answers an A record and only the TXT says "This list is no longer in    #
    # operation, please deconfigure it".                                      #
    #                                                                         #
    # Removed 2026-09-22, alive but deliberately dropped:                     #
    #   dnsbl-1/-2/-3.uceprotect.net  escalates entire netblocks from single  #
    #                        spamtrap hits, and charges for delisting         #
    #   ips.backscatterer.org  UCEPROTECT-run; only meaningful against null-  #
    #                        sender bounces, lists legitimate MTAs otherwise  #
    #   dnsbl.dronebl.org    IRC-drone heritage, marginal for mail            #
    #                                                                         #
    # Whitelists: rspamd already queries list.dnswl.org (IP, symbols          #
    # RCVD_IN_DNSWL_*) and dwl.dnswl.org (domain, DWL_DNSWL_*, requires a     #
    # valid DKIM signature), plus Mailspike's RWL_MAILSPIKE_*.  Weights are   #
    # in metrics.conf and are shaped on purpose: IP-based whitelisting stays  #
    # weak (-0.125 .. -0.5, an IP proves little) while the DKIM-bound domain  #
    # whitelist carries upstream's -1.0 .. -3.5, because there the sender     #
    # actually authenticated.                                                 #
    #                                                                         #
    # IPv6 is covered by zen.spamhaus.org and upstream's RBL_SEM_IPV6         #
    # (bl.ipv6.spameatingmonkey.net) on the IP side, and by DWL,              #
    # dbl.spamhaus.org and Mailspike on the domain/DKIM side.                 #
    ###########################################################################

    # SpamCop - spamtraps plus user reports.  Listings expire after ~24 h, so
    # a false positive heals itself without anyone filing a delisting request.
    spamcop {
        symbol = "RBL_SCBL";
        rbl = "bl.spamcop.net";
        from = true;       # IP-based DNSBL - check sender IP
    }

    # PSBL (Passive Spam Block List) - spamtrap-fed, free delisting, and run
    # independently of SpamCop and Spamhaus, so a hit is real corroboration.
    psbl_org {
        symbol = "RBL_PSBL";
        rbl = "psbl.surriel.com";
        from = true;
    }
}
