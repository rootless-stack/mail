# local.d/multimap.conf — local black/white lists
# Map files are read from the local.d/ directory (same volume mount).
# Edit the .map.inc files to add/remove entries — no restart needed.

local_bl_ip {
    type   = "ip";
    map    = "$CONFDIR/local.d/local_bl_ip.map.inc";
    symbol = "LOCAL_BL_IP";
    description = "Local IP blacklist";
}
local_bl_from {
    type   = "from";
    map    = "$CONFDIR/local.d/local_bl_from.map.inc";
    symbol = "LOCAL_BL_FROM";
    description = "Local envelope-from blacklist";
}
local_bl_rcpt {
    type   = "rcpt";
    map    = "$CONFDIR/local.d/local_bl_rcpt.map.inc";
    symbol = "LOCAL_BL_RCPT";
    description = "Local envelope-rcpt blacklist";
}
local_wl_ip {
    type   = "ip";
    map    = "$CONFDIR/local.d/local_wl_ip.map.inc";
    symbol = "LOCAL_WL_IP";
    description = "Local IP whitelist";
}
local_wl_from {
    type   = "from";
    map    = "$CONFDIR/local.d/local_wl_from.map.inc";
    symbol = "LOCAL_WL_FROM";
    description = "Local envelope-from whitelist";
}
local_wl_rcpt {
    type   = "rcpt";
    map    = "$CONFDIR/local.d/local_wl_rcpt.map.inc";
    symbol = "LOCAL_WL_RCPT";
    description = "Local envelope-rcpt whitelist";
}

# Header From in one of our domains (or a subdomain: eSLD match).  Only a
# condition for force_actions OWN_DOMAIN_DMARC_REJECT, hence no score.
own_domain_from {
    type   = "header";
    header = "From";
    filter = "email:domain:tld";
    map    = "$CONFDIR/local.d/own_domains.map";
    symbol = "FROM_OWN_DOMAIN";
    score  = 0.0;
    description = "From header in one of our mail domains";
}
