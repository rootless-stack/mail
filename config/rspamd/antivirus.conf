# rspamd local.d/antivirus.conf — ClamAV integration
clamav {
  action   = "reject";
  symbol   = "CLAM_VIRUS";
  type     = "clamav";
  log_clean = true;
  servers  = "clamd:3310";
  scan_mime_parts = true;
  scan_text_mime  = false;
  scan_image_mime = false;
  max_size = 20971520;  # 20 MB
  # clamd blocks scans while it reloads its signatures (~20-30 s, clamd.conf
  # ConcurrentDatabaseReload no).  Wait that out once instead of failing
  # after the default 5 s x 3 tries, which passed the mail unscanned
  # (CLAM_VIRUS_FAIL).  Needs task_timeout (options.inc) above it.
  timeout = 60.0;
  retransmits = 0;
}
