actions {
    reject     = 15;
    add_header = 7;
    greylist   = 5;
}

symbol "IP_SCORE" {
  weight = 2.0;
  description = "IP reputation";
}

group "antivirus" {
    symbol "JUST_EICAR" {
      weight = 2.0;
      description = "EICAR test signature";
    }
    symbol "CLAM_AV" {
      weight = 30.0;
      description = "ClamAV — virus suspect";
    }
}

group "bayes" {
    # rspamd scales the weight by probability non-linearly (94 % → 0.62,
    # 98.3 % → 0.87, 99.5 % → 0.96).  8.5 puts ≥ 98 % into Junk on its own;
    # at 6.0 shop spam with clean SPF/DKIM sat at 98-99.9 % with no action
    # (2026-10-08).  Alone it never reaches reject (15).
    symbol "BAYES_SPAM" {
        weight = 8.5;
        description = "Message probably spam, probability: ";
    }
}

# Local fuzzy hashes trained via IMAPSieve on Junk moves
# (dovecot/sieve-pipe/learn-spam.sh + fuzzy_check.conf.j2).
# Weight matches the max_score in the fuzzy_map's flag=1 entry so a
# direct hit produces the same contribution as the configured ceiling.
group "fuzzy_local" {
    symbol "FUZZY_LOCAL_DENIED" {
        weight = 12.0;
        description = "User-trained local fuzzy spam hash";
    }
}

group "encryption" {
    symbol "RCVD_TLS_ALL" {
        weight = -0.5;
        description = "All hops used encrypted transports";
    }
    symbol "RCVD_TLS_LAST" {
        weight = -0.1;
        description = "Last hop used encrypted transport";
    }
    symbol "RCVD_NO_TLS_LAST" {
        weight = 0.1;
        description = "Last hop did not use encrypted transport";
    }
}

group "mx" {
    symbol "MX_INVALID" {
      weight = 1.0;
      description = "No connectable MX";
    }
    symbol "MX_MISSING" {
      weight = 2.0;
      description = "No MX record";
    }
    symbol "MX_GOOD" {
      weight = -0.5;
      description = "MX was ok";
    }
}

group "rbl" {
    symbol "RCVD_IN_DNSWL_NONE" {
        weight = -0.125;
        description = "Sender at dnswl.org — none trust";
    }
    symbol "RCVD_IN_DNSWL_LOW" {
        weight = -0.250;
        description = "Sender at dnswl.org — low trust";
    }
    symbol "RCVD_IN_DNSWL_MED" {
        weight = -0.375;
        description = "Sender at dnswl.org — medium trust";
    }
    symbol "RCVD_IN_DNSWL_HI" {
        weight = -0.500;
        description = "Sender at dnswl.org — high trust";
    }
    # ── DNSBL weights ────────────────────────────────────────────────────
    # Design rule: no single list may reach `reject` (15) on its own, so a
    # listing is always evidence to be corroborated by SPF/DKIM/DMARC, bayes
    # or content - never a verdict.  Two lists agreeing (~5) greylists, three
    # (~7) adds the spam header.  The worst case a single provider can reach
    # is Spamhaus at 14.0 with every one of its zones hitting at once.
    #
    # Spamhaus, BlockList.de and Mailspike are rspamd's own built-in RBLs;
    # only their weights are overridden here (upstream ships SBL/XBL at 4.0,
    # DROP at 7.0 and RBL_BLOCKLISTDE at 4.0, each of which would cross
    # add_header=7 or approach reject alone).  local.d/rbl.conf must not
    # redefine those zones - see the header comment there.

    # Spamhaus zen - the anchor: strongest FP discipline and a real delisting
    # process.  Free tier covers us (low volume, own resolver).
    symbol "RBL_SPAMHAUS_SBL" {
        weight = 3.5;
        description = "Spamhaus SBL — known spam source";
    }
    symbol "RBL_SPAMHAUS_CSS" {
        weight = 2.5;
        description = "Spamhaus CSS — snowshoe / compromised sender";
    }
    symbol "RBL_SPAMHAUS_XBL" {
        weight = 2.5;
        description = "Spamhaus XBL — exploited machine / proxy";
    }
    symbol "RBL_SPAMHAUS_PBL" {
        weight = 0.5;
        description = "Spamhaus PBL — policy (not an MTA), weak signal";
    }
    symbol "RBL_SPAMHAUS_DROP" {
        weight = 5.0;
        description = "Spamhaus DROP — hijacked / criminal netblock";
    }

    symbol "RBL_SCBL" {
        weight = 2.5;
        description = "SpamCop Blocking List";
    }
    symbol "RBL_PSBL" {
        weight = 2.0;
        description = "Passive Spam Block List";
    }

    # BlockList.de is fail2ban-sourced: it lists brute-forcers and scanners,
    # not spam senders.  That makes it genuinely independent evidence, and for
    # the same reason it must stay light - an IP listed for SSH scanning is
    # not necessarily sending spam.
    symbol "RBL_BLOCKLISTDE" {
        weight = 1.0;
        description = "BlockList.de — attacker IP (fail2ban-sourced)";
    }
    symbol "RECEIVED_BLOCKLISTDE" {
        weight = 0.5;
        description = "BlockList.de — attacker IP in Received chain";
    }

    # Mailspike (rep.mailspike.net) keeps rspamd's upstream weights: WORST 2.0
    # / VERYBAD 1.5 / BAD 1.0, plus negative RWL_MAILSPIKE_* that *reward* a
    # good sender reputation.  Already in range, nothing to override.
}

group "local" {
    symbol "LOCAL_BL_IP" {
        weight = 15.0;
        description = "Sender IP in local IP blacklist";
    }
    symbol "LOCAL_BL_FROM" {
        weight = 15.0;
        description = "Sender in local from blacklist";
    }
    symbol "LOCAL_BL_RCPT" {
        weight = 15.0;
        description = "Recipient in local rcpt blacklist";
    }
    symbol "LOCAL_WL_IP" {
        weight = -5.0;
        description = "Sender IP in local IP whitelist";
    }
    symbol "LOCAL_WL_FROM" {
        weight = -5.0;
        description = "Sender in local from whitelist";
    }
    symbol "LOCAL_WL_RCPT" {
        weight = -5.0;
        description = "Recipient in local rcpt whitelist";
    }
}
