# 10-master.conf — service socket config

service imap-login {
  inet_listener imap {
    port = 0   # disabled — only IMAPS
  }
  inet_listener imaps {
    port = 993
    ssl  = yes
  }
  process_min_avail = 1
}

# LMTP and auth-client are Unix sockets in /run/rootless-ipc/mail/, shared
# with postfix:
#   lmtp.sock         postfix virtual_transport
#   auth-client.sock  postfix smtpd_sasl_path (SASL against LDAP)
# The dovecot master (container root = the host user mail-svc) creates
# them in a directory mail-svc owns; `mode = 0666` lets postfix's workers
# connect, and the directory ACL (tmpfiles.d) is the gate.
# Connecting from OUTSIDE mail-svc's containment is blocked at the dir
# level — mode 0750 + a POSIX ACL whitelist for the in-namespace
# consumers (vmail-mapped, postfix-mapped, and host uid 6002 itself for
# fetchmail's keep-id container).
service lmtp {
  # Every mailbox is vmail's (mail_uid), so lmtp, which parses each
  # message and runs Sieve, never needs root to switch users.  The
  # internal group reaches anvil's connect-limit socket.
  user = vmail
  extra_groups = $SET:default_internal_group
  unix_listener /run/rootless-ipc/mail/lmtp.sock {
    user  = vmail
    group = vmail
    mode  = 0666
  }
}

service auth {
  # auth-userdb stays unix and dovecot-internal — only dovecot's own
  # auth-worker reads it, perms can be tight.
  unix_listener auth-userdb {
    mode  = 0600
    user  = vmail
  }
  # auth-client UDS: postfix consumes via smtpd_sasl_type = dovecot +
  # smtpd_sasl_path = /run/rootless-ipc/mail/auth-client.sock in main.cf.
  unix_listener /run/rootless-ipc/mail/auth-client.sock {
    user  = vmail
    group = vmail
    mode  = 0666
  }
}

# Full-text indexing (90-plugin.conf).  Default is 10 workers of up to
# 256 MB each, far past this container's 1 GiB cap; two keep a backfill
# (`doveadm index -A -q`) from getting dovecot OOM-killed.  It parses
# every message, so like lmtp it runs as vmail, not root.
service indexer-worker {
  process_limit = 2
  user = vmail
}

service auth-worker {
  # 2.4 requires the `$SET:` prefix to reference a config variable
  # (the bare `$default_internal_user` form is no longer recognised
  # and gets treated as a literal username).
  user = $SET:default_internal_user
}

service managesieve-login {
  # ManageSieve is exposed publicly on 0.0.0.0:4190 (host network,
  # no `listen =` line) — NC Mail, Thunderbird, Roundcube connect with
  # STARTTLS to mail.<primary>:4190.
  # Auth still goes through the LDAP backend + dovecot's
  # auth_allow_cleartext=no gate, and crowdsec's dovecot scenarios cover
  # brute-force attempts.
  inet_listener sieve {
    port = 4190
  }
}

# ── Per-protocol plugin loading ────────────────────────────────────────────
# 2.4 replaced the flat `mail_plugins = a b c` syntax with a boolean map and
# made per-protocol overrides additive — there is no longer any ordering
# subtlety where a later global setting fails to reach an earlier filter.
mail_plugins {
  # `quota` enforces the per-user storage cap configured in 90-plugin.conf;
  # loading it globally covers LMTP delivery (bounce when over quota) and
  # IMAP storage operations (APPEND, COPY).
  quota = yes

  # Full-text search index (90-plugin.conf).  Global so LMTP indexes each
  # message on delivery and IMAP on APPEND/COPY.
  fts = yes
  fts_flatcurve = yes
}

# imap_sieve activates IMAPSieve (spam/ham learning on folder moves);
# imap_quota exposes the IMAP QUOTA extension so clients can read usage.
protocol imap {
  mail_plugins {
    imap_sieve = yes
    imap_quota = yes
  }
}

# sieve runs delivery-time Sieve rules (filtering, filing, vacation replies)
protocol lmtp {
  mail_plugins {
    sieve = yes
  }
}
