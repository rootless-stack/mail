# 90-plugin.conf — mail plugins
# Covers: full-text search, Sieve, IMAPSieve spam/ham learning, quota.
#
# Dovecot 2.4 removed the legacy `plugin { ... }` wrapper.  Every plugin
# setting is now a normal top-level setting; per-protocol plugin loading
# is handled in 10-master.conf via `protocol imap { mail_plugins { … } }`
# / `protocol lmtp { mail_plugins { … } }` filter blocks.
#
# Mail is stored as plaintext Maildir.

# ── Full-text search (fts_flatcurve = Xapian) ──────────────────────────────
# One index per mailbox, stored next to it in the user's Maildir (so it is
# replicated and backed up with the mail).  IMAP SEARCH BODY/TEXT — what
# iOS Mail's server search sends — answers from it instead of reading
# every message.  Matches the start of a word ("rechn" finds "Rechnung");
# substring search would multiply the index size.  Attachments are not
# indexed (no decoder), only text parts.  Messages the index lacks (mail
# from before it existed) are added on the first body search of their
# mailbox; `doveadm index` fills it ahead of time.
fts flatcurve {
}
fts_autoindex = yes
# Spam is not worth indexing on arrival; a body search in Junk indexes
# what it lacks first (fts_search_add_missing), like any folder.
mailbox Junk {
  fts_autoindex = no
}
# Plain words plus whole addresses; ICU lowercases and strips accents, so
# "Ärger" matches "arger".  No stemming or stopwords: the mail is German
# and English, and a single-language stemmer would mangle the other.
language_tokenizers = generic email-address
language_filters = normalizer-icu
language de {
  default = yes
}

# ── Sieve storage ──────────────────────────────────────────────────────────
# 2.4 replaced the flat `sieve = file:~/sieve;active=~/.dovecot.sieve` with
# ONE named `sieve_script` block of `type = personal`: `path` is the
# ManageSieve script storage DIRECTORY, `active_path` the symlink to the
# active script.  FOOTGUN: doveconf doesn't validate `type` or the path
# semantics — a previous two-block version (`type = personal` with
# `path = ~/.dovecot.sieve`, plus a made-up `type = personal_storage`)
# parsed fine, then created ~/.dovecot.sieve as a DIRECTORY on first use,
# breaking ManageSieve activation and dsync's sieve sync for every user
# ("Active sieve script file … is no symlink nor a regular file").
sieve_script personal {
  type        = personal
  driver      = file
  path        = ~/sieve
  active_path = ~/.dovecot.sieve
}

# Global delivery rule for EVERY mail account, including accounts without
# a personal Sieve script: X-Spam: Yes goes to INBOX.Junk; fetchmail's
# X-Deliver-To-Folder is stripped and routes remaining fetched mail.
# See sieve/delivery-rules.sieve.
# `bin_path`: where the compiled .svbin goes.  /etc/dovecot is a read-only
# mount, so without it every delivery logs "save: failed to create temporary
# file … Read-only file system" and recompiles the script from source.
# Directory, created on first use; one file per script name.  Only on the
# admin scripts — users' ~/sieve keeps compiling next to the source.
# Pigeonhole recompiles only when the source is NEWER than the .svbin, and
# the config rsync keeps the commit-time mtime, so every dovecot reload
# (a config deploy) wipes /tmp/sieve-bin first — otherwise a
# deployed script older than the last compile never runs (2026-09-28).
sieve_script delivery_rules {
  type   = before
  driver = file
  path   = /etc/dovecot/sieve/delivery-rules.sieve
  bin_path = /tmp/sieve-bin
}

# ── Mail quota ─────────────────────────────────────────────────────────────
# Per-account storage cap: mailQuotaBytes from LDAP (auth-ldap.conf.ext),
# 1 GiB where it is unset.  The plugin is loaded in 10-master.conf
# (globally for delivery enforcement, plus imap_quota for the IMAP QUOTA
# extension), but nothing is enforced without a quota root: this block.
# `count` keeps its counters in dovecot.list.index; after enabling it on
# existing mailboxes, `doveadm quota recalc -A` once.
quota "User" {
  driver = count
  # Mails postmaster when an account crosses 90% (once per crossing).
  warning warn-90 {
    quota_storage_percentage = 90
    execute quota-warning {
      args = 90 %{user}
    }
  }
}
# Run through /bin/sh, so the script needs no exec bit; vmail reads it.
service quota-warning {
  executable = script /bin/sh /etc/dovecot/quota/warning.sh
  user = vmail
  unix_listener quota-warning {
    user = vmail
  }
}
quota_storage_size        = 1G
quota_exceeded_message    = Mailbox quota exceeded — please delete or archive older messages.

# ── Sieve runtime / extensions ─────────────────────────────────────────────
sieve_max_script_size     = 1M
# In 2.3 setting `sieve_quota_max_{scripts,storage} = 0` meant "no quota".
# 2.4 forbids that literal 0 ("must not be 0") and treats omission of the
# setting as unlimited — so we leave both quotas unset.

# `editheader` (for `deleteheader`) is a default-OFF Pigeonhole extension
# that delivery-rules.sieve needs.  `mailbox` (for `fileinto :create`) is
# already default-on, so we don't list it.
#
# `sieve_extensions` is a BOOLLIST in 2.4: a flat `key = a b c` assignment
# REPLACES the default extension list (clobbering fileinto, variables, …).
# The block form below is additive — each `name = yes` toggles that
# extension on without disturbing the defaults.  See upstream
# `src/lib-sieve/sieve-settings.c` for the default set.
sieve_extensions {
  editheader = yes
}

# Enable vnd.dovecot.pipe and friends so sieve scripts can call shell commands
# and look up imap.mailbox / vnd.dovecot.mailbox-from environment items
# (used by report-ham.sieve to gate on source mailbox).  doveconf warns at
# parse time that vnd.dovecot.pipe / vnd.dovecot.duplicate are unknown
# because the providing plugins aren't loaded standalone — at runtime
# sieve_extprograms / the duplicate plugin register them.
# `duplicate` lost its `vnd.dovecot.` prefix in 2.4 — it's now a stock sieve
# extension.  The `vnd.dovecot.*` names below are plugin-provided
# (sieve_extprograms supplies pipe; sieve_imapsieve supplies environment
# additions) and only register at runtime, so doveconf prints harmless
# parse-time warnings about them.
#
# BOOLLIST (default empty) — block form keeps the additive intent explicit
# so future edits don't silently clobber anything we later inherit.
sieve_global_extensions {
  vnd.dovecot.pipe = yes
  vnd.dovecot.environment = yes
  duplicate = yes
}

# IMAPSieve sub-plugins.  BOOLLIST (default empty); same block-form rationale
# as sieve_extensions / sieve_global_extensions above.
sieve_plugins {
  sieve_imapsieve = yes
  sieve_extprograms = yes
}

# Executed straight from the read-only config mount (mode 0755, kept by
# render.py).  Nothing writable in the container is
# executable, so /tmp stays noexec.
sieve_pipe_bin_dir        = /etc/dovecot/sieve-pipe

# Outgoing Sieve mail (vacation, redirect) goes to postfix's ACL-gated
# sieve-submit/smtp listener, which rspamd DKIM-signs (master.cf).  The
# image's busybox sendmail spoke unauthenticated SMTP to 127.0.0.1:25,
# where nothing may relay.  dovecot appends `-i -f <sender> -- <rcpts>`.
sendmail_path = /usr/bin/msmtp --host=localhost --socket=/run/rootless-ipc/sieve-submit/smtp
# Redirect with our recipient as envelope sender, not the original one:
# SPF then passes for our own domain at the next hop, and the listener
# accepts only our domains.  A null sender stays null (RFC 5228 4.2), so
# redirected bounces can't loop.
sieve_redirect_envelope_from = orig_recipient

# ── IMAPSieve — spam/ham learning on message moves ─────────────────────────
# 2.4 dropped the flat `imapsieve_mailbox1_*` / `imapsieve_mailbox2_*` index
# settings.  Each trigger is now a named `sieve_script` block with
# `type = after` (or `before` — the SAME type names as delivery scripts;
# `cause = COPY` is what keeps them out of the LMTP chain), and an optional
# `mailbox <name> { }` filter selecting the *destination* mailbox, matched
# without the namespace prefix.  NOT `imap_after`: doveconf accepts any
# string here, but imapsieve only ever queries "before"/"after"
# (pigeonhole imap-sieve-storage.c) — with `imap_after` nothing fired and
# rspamd never learned from moves.
#
# The *source* mailbox of a COPY is selected with an `imapsieve_from
# <name> { }` block (2.4's replacement for `mailbox2_from`).  Unlike the
# destination filter it matches the FULL virtual name, prefix included:
# `imapsieve_from Junk` never fires here, `imapsieve_from INBOX.Junk` does.
# The sieve environment item `vnd.dovecot.mailbox-from` is always empty in
# 2.4, so a gate inside the script can't replace this block — the old
# in-script gate stopped every run and ham was never learned.
#
# Trigger: message COPIED/MOVED INTO Junk → learn spam.
# The mailbox filter wraps the script block (filter outside, list inside —
# the documented form).  The other way round, `sieve_script x { mailbox
# Junk {} }`, is an empty nested filter = no filter at all: report-spam
# then ran on EVERY copy/move and would have trained every moved mail as
# spam.
# This `mailbox Junk` merges with the special-use block in 10-mail.conf.
mailbox Junk {
  sieve_script imapsieve_junk_in {
    type   = after
    driver = file
    path   = /etc/dovecot/sieve/report-spam.sieve
    bin_path = /tmp/sieve-bin
    cause  = COPY
  }
}

# Trigger: message COPIED/MOVED OUT OF Junk → learn ham.  The script
# itself skips destinations Trash/Deleted Messages/Deleted Items.
imapsieve_from INBOX.Junk {
  sieve_script imapsieve_junk_out {
    type   = after
    driver = file
    path   = /etc/dovecot/sieve/report-ham.sieve
    bin_path = /tmp/sieve-bin
    cause  = COPY
  }
}
