# 10-ssl.conf — TLS

ssl = required
# A copy staged by the entrypoint from ~/certs (stage-certs): dovecot's
# child processes drop privileges and cannot read the mount itself.
#
# 2.4 renamed the cert/key/CA/DH settings (and dropped the `<file` indirection
# — these now take plain paths).
ssl_server_cert_file = /tmp/dovecot-cert/fullchain.pem
ssl_server_key_file  = /tmp/dovecot-cert/privkey.pem
# Outbound TLS trusts the system bundle, named like postfix's smtp_tls_CAfile.
ssl_client_ca_file   = /etc/ssl/certs/ca-certificates.crt

# Mozilla Intermediate (v6.0) TLS 1.2 suites: ECDHE + AEAD only, no DHE
# (IMAP/submission clients are our own users' MUAs, all of which do ECDHE).
# TLS 1.2 stays: Outlook on Windows 10 (Schannel) has no TLS 1.3.
# Curves come from OpenSSL's defaults (X25519MLKEM768, X25519, P-256, P-384
# on OpenSSL 3.5).
ssl_min_protocol       = TLSv1.2
ssl_cipher_list        = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
# `ssl_prefer_server_ciphers` was removed in 2.4 — client preference is the
# default and (per Mozilla Intermediate) the right behaviour anyway.
