# 10-auth.conf — authentication config
#
# Only PLAIN is enabled.  PLAIN over enforced TLS (auth_allow_cleartext = no
# below) is the modern recommendation; the legacy LOGIN mechanism existed
# for Outlook 2003 / Eudora compatibility and is unneeded for any current
# mail client.
auth_mechanisms = plain

# Disable cleartext auth over non-TLS (enforced by ssl=required in 10-ssl.conf).
# Renamed in 2.4 from `disable_plaintext_auth` — the new name is positive
# (allow rather than disable), so the boolean is inverted.
auth_allow_cleartext = no

# Primary (and only) auth: LDAP — all users live in lldap.  The PostfixAdmin
# migration fallback (auth-sql.conf.ext, 2.3 syntax, would crash dovecot 2.4
# if re-enabled) was deleted along with the migration window cleanup.
!include auth-ldap.conf.ext
