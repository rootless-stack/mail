# 10-mail.conf — mail storage config

mail_home    = /var/mail/vmail/%{user | domain}/%{user | username}
# 2.4 replaces `mail_location = maildir:~/Maildir` with this split:
mail_driver  = maildir
mail_path    = ~/Maildir
mail_uid     = 5000
mail_gid     = 5000
mail_privileged_group = vmail
first_valid_uid = 5000

# Same virtual layout as the old Plesk box (`INBOX.Sent`, `INBOX.Archiv.x`):
# every client out there is configured for it, and macOS Mail choked on the
# `/`-without-prefix layout at the 2026-09-20 cutover ("Character not
# allowed in mailbox name: '.'").  Presentation only — Maildir++ on disk is
# `.Sent` / `.Archiv.x` either way.  The `mailbox <name>` blocks below and
# the imap_sieve `mailbox Junk` filter match with the prefix stripped, so
# they stay unprefixed; `imapsieve_from` and sieve *environment* strings
# (report-ham.sieve) are full virtual names and carry the prefix.
namespace inbox {
  inbox = yes
  separator = .
  prefix = INBOX.
}

# Special-use mailboxes declared at the top level (not inside the namespace).
# 2.4's named-list filters resolve `mailbox <name>` references from
# sieve_script imap_after blocks (see 90-plugin.conf) against the *global*
# mailbox-config scope — declaring these only inside `namespace inbox { … }`
# leaves the imap_sieve filter unable to resolve them and dovecot refuses
# to start with "Filter mailbox=Junk unexpectedly not found".
mailbox Drafts {
  auto = subscribe
  special_use = \Drafts
}
mailbox Junk {
  auto = subscribe
  special_use = \Junk
}
mailbox Sent {
  auto = subscribe
  special_use = \Sent
}
mailbox Trash {
  auto = subscribe
  special_use = \Trash
}
# Aliases the old box also flagged (assets/references/etc/dovecot/conf.d/
# 15-mailboxes.conf) — clients that created these names keep their mapping.
mailbox Spam {
  special_use = \Junk
}
mailbox "Sent Messages" {
  special_use = \Sent
}
mailbox "Sent Items" {
  special_use = \Sent
}
