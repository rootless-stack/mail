# dovecot.conf — top-level config, rendered by render.py
# All per-feature config is split into 10-*.conf and 90-*.conf files.

# Dovecot 2.4 requires these two pragmas as the very first settings.
# They opt the config in to the 2.4 schema and storage format; without
# them doveconf rejects every other setting on parse.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap lmtp sieve

# Host network: bind IMAPS and ManageSieve on IPv4 and IPv6.
listen = *, ::

# Log to the container's stdio so `podman logs` / `journalctl` shows them.
# Default on Alpine is syslog, which doesn't exist in the container — the
# result is a totally silent dovecot that's hard to debug.  Warnings and
# errors on stderr (journal priority err), the rest on stdout (info): with
# everything on stderr every login was red.  crowdsec selects these lines
# by CONTAINER_NAME, whichever the stream.
log_path      = /dev/stderr
info_log_path = /dev/stdout
debug_log_path = /dev/stdout

# Include split config files
!include conf.d/*.conf
