LocalSocket /run/clamav/clamd.ctl
TCPSocket 3310
TCPAddr 0.0.0.0
# LogFile intentionally omitted: clamd --foreground logs to stderr by default.
# /dev/stdout causes a symlink loop under fuse-overlayfs in rootless podman.
LogTime yes
PidFile /run/clamav/clamd.pid
DatabaseDirectory /var/lib/clamav
MaxFileSize 25M
MaxScanSize 100M
ScanMail yes
ScanArchive yes
ArchiveBlockEncrypted no
ScanPDF yes
ScanOLE2 yes
MaxRecursion 10
MaxFiles 10000
# Load a new signature database in place of the old one, not next to it:
# a concurrent reload holds both engines for ~20-30 s, and the container
# peaked at 2.4 GB against ~0.45 GB at rest (2026-10-04).  Scans wait for
# the reload; rspamd's clamav timeout (config/rspamd/antivirus.conf)
# outlasts it, so mail is delayed, not passed unscanned.
ConcurrentDatabaseReload no
