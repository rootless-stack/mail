DatabaseOwner clamav
# UpdateLogFile intentionally omitted: freshclam logs to stdout by default.
# /dev/stdout causes a symlink loop under fuse-overlayfs in rootless podman.
LogTime yes
DatabaseDirectory /var/lib/clamav
Checks 24
DatabaseMirror database.clamav.net
# Tell clamd to reload its in-memory signatures after each successful update.
# Reads LocalSocket from clamd.conf and connects on it.
NotifyClamd /etc/clamav/clamd.conf
# PID file for daemon mode (`freshclam -d`). Lives under /run/clamav which is
# already created (chowned clamav) in the Dockerfile and shared with clamd.
PidFile /run/clamav/freshclam.pid
